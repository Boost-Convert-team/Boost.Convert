{% extends "base.html" %}

{% block title %}Baixar video do YouTube - Boost.Convert{% endblock %}

{% block content %}
<main class="page-section">
    <div class="section-heading reveal">
        <div class="eyebrow"><i data-lucide="video" aria-hidden="true"></i> Ferramenta de video</div>
        <h1 id="youtube-download-title">Baixar video do YouTube</h1>
        <p>Cole o link e baixe o arquivo em MP4.</p>
    </div>

    <div class="converter-grid reveal">
        <section class="upload-card" aria-labelledby="youtube-download-title">
            <form class="converter-form" action="{{ url_for('youtube_downloads.download_youtube') }}" method="POST" data-loading-form data-no-page-transition>
                <div class="form-field">
                    <label for="url">URL do YouTube</label>
                    <input id="url" type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>
                </div>

                <div class="converter-options">
                    <div class="converter-option-field">
                        <label for="qualidade">Qualidade</label>
                        <select id="qualidade" name="qualidade">
                            <option value="720p" selected>720p</option>
                            <option value="480p">480p</option>
                            <option value="360p">360p</option>
                        </select>
                    </div>
                </div>

                <button class="button button-primary converter-button" type="submit">
                    Baixar video
                </button>
            </form>
        </section>
    </div>
</main>
{% endblock %}
