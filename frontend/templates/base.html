<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Boost.Convert | Conversor de arquivos online{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Converta PDF, documentos, imagens, videos e audios online no Boost.Convert. Use no navegador, sem instalacao, com rapidez, seguranca e arquivos protegidos.{% endblock %}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{% block canonical_url %}{{ request.base_url }}{% endblock %}">
    {% set default_og_image = url_for('static', filename='img/boost-convert-logo-clean.png', _external=True) %}
    <meta property="og:title" content="{% block og_title %}{{ self.title()|striptags|trim }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ self.meta_description()|striptags|trim }}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ default_og_image }}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ self.canonical_url()|striptags|trim }}{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ self.title()|striptags|trim }}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ self.meta_description()|striptags|trim }}{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ default_og_image }}{% endblock %}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo boost.png') }}?v={{ favicon_version }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='img/logo boost.png') }}?v={{ favicon_version }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo boost.png') }}?v={{ favicon_version }}">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="site-shell">
        {% include "partials/header.html" %}

        {% block content %}{% endblock %}

        {% include "partials/footer.html" %}
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script id="tool-search-data" type="application/json">{{ tool_search_index|default([], true)|tojson }}</script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tool_search.js') }}"></script>
    <script src="{{ url_for('static', filename='js/forms.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reveal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
